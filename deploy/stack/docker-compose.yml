# QLCV — cơ sở dữ liệu tự chạy: PostgreSQL + PostgREST (đều là phần mềm mã nguồn mở, KHÔNG dùng dịch vụ Supabase).
# PostgREST biến CSDL thành API /rest/v1 (giao diện vẫn dùng thư viện máy khách cũ). Kho file nằm trong máy chủ API (deploy/api-server).
# Các cổng chỉ nghe 127.0.0.1 — ra Internet qua Caddy (HTTPS).
name: qlcv
services:
  db:
    image: postgres:16
    container_name: qlcv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - /opt/qlcv/pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "timezone=Asia/Ho_Chi_Minh"]

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: qlcv-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_POOL: "10"
      PGRST_DB_CONFIG: "true"            # đọc cấu hình theo vai trò (vd. pgrst.db_pre_request của kiểm tra mã ghi)
      PGRST_OPENAPI_MODE: disabled       # không công bố cấu trúc bảng cho người lạ
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:3000:3000"
